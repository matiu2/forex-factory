[package]
name = "forex-factory"
version = "0.1.0"
edition = "2024"
description = "Async Rust library for scraping economic event data from Forex Factory calendar"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matiu2/forex-factory"
keywords = ["forex", "trading", "calendar", "economic-events", "scraper"]
categories = ["web-programming::http-client", "parsing", "asynchronous"]
readme = "README.md"
rust-version = "1.88"

[features]
default = ["native-tls", "brotli", "http2"]

# TLS backends - choose one
rustls = ["reqwest/rustls"]
rustls-native-certs = ["reqwest/rustls-native-certs"]
rustls-no-provider = ["reqwest/rustls-no-provider"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]

# Compression
gzip = ["reqwest/gzip"]
brotli = ["reqwest/brotli"]
deflate = ["reqwest/deflate"]
zstd = ["reqwest/zstd"]

# Other
http2 = ["reqwest/http2"]
http3 = ["reqwest/http3"]
socks = ["reqwest/socks"]
hickory-dns = ["reqwest/hickory-dns"]

# WASM timezone detection (auto-detect browser timezone via js-sys)
wasm-timezone = ["js-sys"]

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
parse-display = "0.10.0"
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
typed-builder = "0.23.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iana-time-zone = "0.1.64"
reqwest = { version = "0.13.1", default-features = false, features = ["cookies"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13.1", default-features = false }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.58"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
